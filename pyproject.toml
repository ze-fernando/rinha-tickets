[project]
name = "ticket"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "sqlalchemy[asyncio]>=2.1.5",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
]

authors = [
    {name = "ze-fernando",email = "zefernando.dev@gmail.com"},
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "pdm run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

migrate = { composite = [
    'pdm run alembic revision --autogenerate -m "{args}"',
    'pdm run alembic upgrade head'
] }


